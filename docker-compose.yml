version: '3.8'

services:
  # ============================================
  # Base de datos para Account Service
  # ============================================
  account-db:
    image: postgres:15-alpine
    container_name: account-db
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: account_user
      POSTGRES_PASSWORD: account_pass_123
      # Configuración adicional para mejor rendimiento
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - account_db_data:/var/lib/postgresql/data
      # Si tienes un script de inicialización, descomenta esta línea
      # - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account_user -d account_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Configuración de recursos (opcional)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

# ============================================
# Volúmenes persistentes
# ============================================
volumes:
  account_db_data:
    driver: local

# ============================================
# Redes
# ============================================
networks:
  banking-network:
    driver: bridge
    name: banking-network